name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Go build & vet
        run: |
          go build ./...
          go vet ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build helper for tests
        run: go build -o node/bin/tlsfetch-server ./cmd/server

      - name: Node end-to-end test
        working-directory: node
        run: node test.js
